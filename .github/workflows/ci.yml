# QS-5.3 budgets this workflow at three minutes, so it runs the toolchain directly rather than
# through the Docker-only make targets: `make check` is the local contract, this is the same set of
# checks with the container indirection removed and the caches warm.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db:
        image: ghcr.io/tursodatabase/libsql-server:latest
        env:
          SQLD_NODE: primary
        ports:
          - 8081:8080

    env:
      TEST_TURSO_URL: http://localhost:8081

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0

      - name: Test
        run: go test -race -p 1 -coverprofile=coverage.out ./...

      - name: Domain coverage gate (QS-5.1)
        run: |
          go test -coverprofile=domain.out ./internal/domain/...
          go tool cover -func=domain.out | tail -1 | \
            awk '{ if ($3+0 < 90) { print "domain coverage below 90%: " $3; exit 1 } }'

      - name: Vulnerabilities (QS-4.5)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            README.md
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "docs/**/*.md" "README.md"
          fail: true

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -f deploy/Dockerfile -t zorgscope:ci .
      - name: Image size budget (QS-3.4)
        run: |
          size=$(docker image inspect zorgscope:ci --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -le 26214400 || { echo "image exceeds the 25 MB budget (QS-3.4)"; exit 1; }
