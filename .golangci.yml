# The depguard rules below are the architecture of ADR-0001 in executable form: the domain knows
# nothing but the standard library (QS-5.1), and an upstream client library lives in exactly one
# adapter (QS-5.2). Breaking either is a lint failure, not a review comment.
version: "2"

run:
  timeout: 3m

linters:
  enable:
    - depguard
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
          allow:
            - "$gostd"
            - "github.com/gernotstarke/zorgscope/internal/domain"
        ports:
          files:
            - "**/internal/ports/**"
          allow:
            - "$gostd"
            - "github.com/gernotstarke/zorgscope/internal/domain"
            - "github.com/gernotstarke/zorgscope/internal/ports"
        github-client:
          files:
            - "!**/internal/adapters/github/**"
          deny:
            - pkg: "github.com/shurcooL/githubv4"
              desc: "the GitHub client belongs in internal/adapters/github (QS-5.2)"
        db-driver:
          files:
            - "!**/internal/adapters/libsql/**"
          deny:
            - pkg: "github.com/tursodatabase/libsql-client-go"
              desc: "the libSQL driver belongs in internal/adapters/libsql (QS-5.2)"

    misspell:
      locale: UK

  exclusions:
    rules:
      # Tests may hard-code weak values and read fixture paths; that is what they are for.
      - path: "_test\\.go"
        linters:
          - gosec
