{{define "content"}}
<section class="docs-index">
  <h1>Documentation</h1>
  <p class="docs-lead">zorgscope's requirements, architecture decisions and concepts, rendered from
    the Markdown in the repository (FR-7.1).</p>
  {{range .Docs}}
  <section class="docs-group">
    <h2>{{.Title}}</h2>
    <ul class="docs-list">
      {{range .Pages}}<li><a href="{{.URL}}">{{.Title}}</a></li>{{end}}
    </ul>
  </section>
  {{end}}
</section>
{{end}}
