# Local development runs the same image Fly runs. The process is stateless, so there is
# nothing else to bring up: no database, no volume.
services:
  app:
    # One fixed name, so `docker ps` and the logs say which container this is rather than
    # Compose's default of the directory and the service ("deploy-app-1").
    container_name: zorgscope-local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
