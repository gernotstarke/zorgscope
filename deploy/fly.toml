app = "zorgscope"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  AUTH_MODE = "token"
  LOG_LEVEL = "info"
  PORT = "8080"
  ZORGSCOPE_BASE_URL = "https://zorgscope.fly.dev"
  ZORGSCOPE_CONFIG = "/app/config/fly.bootstrap.yaml"
  ZORGSCOPE_RUNTIME_CONFIG = "/data/zorgscope.yaml"
  ZORGSCOPE_SECRET_STORE = "/data/zorgscope.secrets"
  ZORGSCOPE_DATA = "/data/zorgscope.db"

[[mounts]]
  source = "zorgscope_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[processes]
  app = "/app/bin"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
