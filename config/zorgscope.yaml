# Non-secret configuration (FR-8.1). Secrets come from the environment only — see deploy/env.example.
# This file is baked into the image; CONFIG_PATH points at it.

timezone: Europe/Berlin

refresh:
  # What cron-job.org is configured to. Used for the freshness display; changing it here does not
  # change the schedule — change it in both places (see docs/concepts/configuration.md).
  interval: 15m
  # How old a source's data may be before its tile is shown as stale.
  stale_after: 45m

github:
  login: gernotstarke
  repos:
    - arc42/arc42.org-site
    - arc42/quality.arc42.org
    - gernotstarke/zorgscope

plausible:
  sites:
    - arc42.org
    - quality.arc42.org

todoist:
  filter: "overdue | today"

notifications:
  slack:
    enabled: false
