# Non-secret configuration (FR-8.1). Secrets come from the environment only — see deploy/env.example.
# This file is baked into the image; CONFIG_PATH points at it.

timezone: Europe/Berlin

github:
  # Push access here admits a visitor (FR-8.3).
  auth_repo: gernotstarke/zorgscope
  # The GitHub login zorgscope works for (FR-1.14): whose review a pull request may request, and
  # whose own pull requests are not somebody else's contribution. Without it the Needs-you band
  # holds only the marked items.
  owner: gernotstarke
  # How old the fetched item list may be before a page view refetches it.
  cache_ttl: 5m
  # The repository names are the ones GitHub actually uses, which for the arc42 family means the
  # "-site" suffix on every property that has a website: arc42/quality.arc42.org does not exist,
  # arc42/quality.arc42.org-site does. A name that is merely wrong fetches nothing and reports the
  # repository as failing rather than as missing.
  #
  # QS-3.5 allows two GraphQL queries per repository (issues and pull requests paginate
  # independently) and at most fifteen repositories, so at most 30 per fetch; Load refuses a
  # sixteenth. It holds fifteen: the ceiling exactly, so one more repository needs a budget decision
  # first.
  # The repositories are fetched side by side, so the list's length costs no time, only requests.
  repos:
    - arc42/arc42-template
    - arc42/arc42.org-site
    - arc42/arc42.de-site
    - arc42/quality.arc42.org-site
    - arc42/docs.arc42.org-site
    - arc42/faq.arc42.org-site
    - arc42/examples.arc42.org-site
    - arc42/trainings.arc42.org-site
    - arc42/arc42-generator
    - gernotstarke/zorgscope
    - isaqb-org/curriculum-foundation
    - isaqb-org/glossary
    - isaqb-org/curriculum-req4arc
    - isaqb-org/curriculum-improve
    - isaqb-org/curriculum-adoc
  # The Sites view (FR-1.8): one tile per entry, in this order. Each site names exactly one of the
  # repositories above; a repository no site names would share an Other tile, which the shipped
  # list leaves empty. hue is a key of the palette app.css defines from the arc42 brand registry
  # (arc42/meta.arc42.org, wiki/concepts/brand.md): navy, blue, plum, teal, umber, rose or slate.
  # The three without a brand hue take slate. tag tells apart two sites that share a hue, at most
  # three characters.
  #
  # group (default arc42) is the Radar view a site gets a sector of its own in (FR-1.15). The first
  # group's radar — arc42 — shows its own sites only; the iSAQB radar shows the iSAQB sites and all
  # of arc42 as one sector. The iSAQB sites wear the five oranges, ordered so that tangerine borders
  # neither orange nor rust, and say alerts: false: they are fetched for issues and pull requests
  # only, never for Dependabot alerts (FR-1.16).
  sites:
    - name: arc42-template
      url: https://github.com/arc42/arc42-template
      repo: arc42/arc42-template
      hue: slate
    - name: arc42.org
      url: https://arc42.org
      repo: arc42/arc42.org-site
      hue: navy
    - name: arc42.de
      url: https://arc42.de
      repo: arc42/arc42.de-site
      hue: navy
      tag: DE
    - name: quality.arc42.org
      url: https://quality.arc42.org
      repo: arc42/quality.arc42.org-site
      hue: plum
    - name: docs.arc42.org
      url: https://docs.arc42.org
      repo: arc42/docs.arc42.org-site
      hue: blue
    - name: faq.arc42.org
      url: https://faq.arc42.org
      repo: arc42/faq.arc42.org-site
      hue: teal
    - name: examples.arc42.org
      url: https://examples.arc42.org
      repo: arc42/examples.arc42.org-site
      hue: umber
    - name: trainings.arc42.org
      url: https://trainings.arc42.org
      repo: arc42/trainings.arc42.org-site
      hue: rose
    - name: arc42-generator
      url: https://github.com/arc42/arc42-generator
      repo: arc42/arc42-generator
      hue: slate
    - name: zorgscope
      url: https://github.com/gernotstarke/zorgscope
      repo: gernotstarke/zorgscope
      hue: slate
    - name: curriculum-foundation
      url: https://github.com/isaqb-org/curriculum-foundation
      repo: isaqb-org/curriculum-foundation
      hue: orange
      group: iSAQB
      alerts: false
    - name: glossary
      url: https://github.com/isaqb-org/glossary
      repo: isaqb-org/glossary
      hue: apricot
      group: iSAQB
      alerts: false
    - name: curriculum-req4arc
      url: https://github.com/isaqb-org/curriculum-req4arc
      repo: isaqb-org/curriculum-req4arc
      hue: rust
      group: iSAQB
      alerts: false
    - name: curriculum-improve
      url: https://github.com/isaqb-org/curriculum-improve
      repo: isaqb-org/curriculum-improve
      hue: copper
      group: iSAQB
      alerts: false
    - name: curriculum-adoc
      url: https://github.com/isaqb-org/curriculum-adoc
      repo: isaqb-org/curriculum-adoc
      hue: tangerine
      group: iSAQB
      alerts: false
