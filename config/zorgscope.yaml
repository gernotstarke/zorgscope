# zorgscope runtime configuration (non-secret). Schema: docs/architecture/08-crosscutting-concepts.md §8.3
# Upstream secrets may be bootstrapped from environment variables and then managed through the
# authenticated config API. Deployment/authentication secrets remain environment-only.
server:
  base_url: https://zorgscope.fly.dev
  port: 8080
  timezone: Europe/Berlin

ui:
  tile_poll_seconds: 60
  attention_cap: 30
  tiles: [attention, repos, sites, watch]

snapshot:
  time: "03:00"
  retention_days: 30

github:
  enabled: true
  me: gernotstarke
  poll_interval: 10m
  grace_period: 4h
  stale_after: 720h
  bots: ["[bot]", "dependabot", "renovate"]
  mentions: true
  repos:
    - arc42/arc42.org-site
    - arc42/arc42.de-site
    - arc42/arc42-template
    - arc42/docs.arc42.org-site
    - arc42/quality.arc42.org-site
    - arc42/faq.arc42.org-site
    - gernotstarke/esabuch.de-site
    - gernotstarke/gernotstarke.de-site

plausible:
  enabled: false          # set its API key through the config API before enabling
  poll_interval: 30m
  order: visitors
  sites:
    - arc42.org
    - arc42.de
    - docs.arc42.org
    - quality.arc42.org
    - faq.arc42.org
    - esabuch.de
    - gernotstarke.de

watch:
  enabled: true
  poll_interval: 15m
  warn_days: 14
  credentials: []          # add entries like:
  # - name: status.arc42.org GitHub token
  #   expires: 2026-12-31
  #   used_by: status.arc42.org
  #   url: https://github.com/settings/tokens
  urls:
    - name: status.arc42.org
      url: https://status.arc42.org
      expect_status: 200
      poll_interval: 15m
