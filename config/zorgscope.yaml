# zorgscope runtime configuration (non-secret). Schema: docs/architecture/08-crosscutting-concepts.md §8.3
# Secrets come from environment variables only (GITHUB_TOKEN, PLAUSIBLE_API_KEY, TODOIST_TOKEN, SESSION_SECRET, ENROLL_TOKEN).
server:
  base_url: https://zorgscope.fly.dev
  port: 8080
  timezone: Europe/Berlin

ui:
  tile_poll_seconds: 60
  attention_cap: 30
  tiles: [attention, repos, sites, todoist, news]

snapshot:
  time: "03:00"
  retention_days: 30

github:
  enabled: true
  me: gernotstarke
  poll_interval: 10m
  grace_period: 4h
  stale_after: 720h
  bots: ["[bot]", "dependabot", "renovate"]
  mentions: true
  repos:
    - arc42/arc42.org-site
    - arc42/arc42.de-site
    - arc42/arc42-template
    - arc42/docs.arc42.org-site
    - arc42/quality.arc42.org-site
    - arc42/faq.arc42.org-site
    - gernotstarke/esabuch.de-site
    - gernotstarke/gernotstarke.de-site

plausible:
  enabled: true
  poll_interval: 30m
  order: visitors
  sites:
    - arc42.org
    - arc42.de
    - docs.arc42.org
    - quality.arc42.org
    - faq.arc42.org
    - esabuch.de
    - gernotstarke.de

todoist:
  enabled: true
  poll_interval: 5m
  horizon_days: 7

feeds:
  enabled: false          # enable once providers are chosen (open point O-1)
  poll_interval: 30m
  max_items: 20
  group_by_topic: false
  sources: []
  # - name: Simon Willison
  #   url: https://simonwillison.net/atom/everything/
  #   topic: ai
